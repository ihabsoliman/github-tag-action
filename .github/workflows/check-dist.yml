# `lib/main.cjs` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# it's the self-contained (esbuild-bundled) file that runs.
# We generate it through a build process from `src/`.
# This workflow makes sure the checked-in `lib/` actually matches what we expect it to be.
name: Check dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      - name: Rebuild lib/
        run: npm run build
      - name: Compare the expected and actual lib/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol lib/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: lib
          path: lib/

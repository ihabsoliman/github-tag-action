name: Update major version tag
run-name: Move ${{ github.event.inputs.major_version }} to ${{ github.event.inputs.target }}

on:
  workflow_dispatch:
    inputs:
      major_version:
        description: 'The floating major tag to move, e.g. "v1"'
        required: true
      target:
        description: "The tag or ref it should now point to"
        required: true

permissions:
  contents: write

jobs:
  tag:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate major_version
        env:
          MAJOR_VERSION: ${{ github.event.inputs.major_version }}
        run: |
          [[ "$MAJOR_VERSION" =~ ^v[0-9]+$ ]] || { echo "major_version must look like 'v1'"; exit 1; }
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag new target
        env:
          MAJOR_VERSION: ${{ github.event.inputs.major_version }}
          TARGET: ${{ github.event.inputs.target }}
        run: git tag -f "$MAJOR_VERSION" "$TARGET"
      - name: Push new tag
        env:
          MAJOR_VERSION: ${{ github.event.inputs.major_version }}
        run: git push origin "$MAJOR_VERSION" --force

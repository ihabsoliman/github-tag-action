name: "Auto Tag & Release"
description: "Bump and push git tag on merge"
author: "Ihab Soliman"
outputs:
  new_tag:
    description: "Generated tag"
  new_version:
    description: "Generated tag without the prefix"
  previous_tag:
    description: "Previous tag (or `0.0.0`)"
  previous_version:
    description: "The value of the previous tag (or 0.0.0 if none) without the prefix. Note that if custom_tag is set, this will be undefined."
  release_type:
    description: "The computed release type (`major`, `minor`, `patch` or `custom` - can be prefixed with `pre`)"
  changelog:
    description: "The conventional changelog since the previous tag"
  tag_created:
    description: "Whether a tag was actually created/pushed (`true`/`false`). Other outputs (`new_tag`, `new_version`, etc.) may be populated even when this is `false` (e.g. `dry_run`, or a `soft_fail`'d error) - check this output before acting on them."
inputs:
  github_token:
    description: "Required for permission to tag the repo."
    required: true
  default_bump:
    description: "Which type of bump to use when none explicitly provided when commiting to a release branch (default: `patch`)."
    required: false
    default: "patch"
  force_bump:
    description: "A release type. If specified, it ignores the type of bump provided when committing to a release branch, as well as default_bump"
    required: false
  default_draft_bump:
    description: |
      Which type of bump to use when none explicitly provided when commiting to a prerelease branch with no previous prerelease version (default: same as `default_prerelease_bump`).
      Defaults to prerelease for backward-compatibility with previous behaviour. Might make more sense to set it to the same as `default_bump`.
    required: false
  default_prerelease_bump:
    description: "Which type of bump to use when none explicitly provided when commiting to a prerelease branch (default: `prerelease`)."
    required: false
    default: "prerelease"
  force_prerelease_bump:
    description: "A release type. If specified, it ignores the type of bump provided when committing to a prerelease branch, as well as default_prerelease_bump"
    required: false
  tag_prefix:
    description: "A prefix to the tag name (default: `v`)."
    required: false
    default: "v"
  initial_version:
    description: "The version to assume as the previous version when no matching tag exists yet, i.e. the base for the very first tag this action creates (default: `0.0.0`). Must be a valid semver; a leading `v` is stripped. The action fails if it is not valid semver."
    required: false
    default: "0.0.0"
  tag_search_pattern:
    description: "A glob pattern to filter tags to consider for version bumping (e.g. `v0.*`). Useful for projects with multiple major versions supported simultaneously."
    required: false
  tag_context:
    description: "Which tags to consider when picking the previous tag: `repo` (default) considers every tag in the repository; `branch` considers only tags that are ancestors of the tagged commit. Unrecognized values fall back to `repo` with a warning."
    required: false
    default: "repo"
  append_to_pre_release_tag:
    description: "A suffix to a pre-release tag name (default: `<branch>`)."
    required: false
  custom_tag:
    description: "Custom tag name. If specified, it overrides bump settings."
    required: false
  force_update:
    description: "Updates the sha of a tag if it already exists"
    required: false
    default: "false"
  custom_release_rules:
    description: "Comma separated list of release rules. Format: `<keyword>:<release_type>`. Example: `hotfix:patch,pre-feat:preminor`."
    required: false
  release_branches:
    description: "Comma separated list of branches (JavaScript regular expression accepted) that will generate the release tags. Other branches and pull-requests generate versions postfixed with the commit hash and do not generate any repository tag. Examples: `^master$` or `.*` or `^release.*,^hotfix.*,^master$`... (default: `^master$,^main$`)."
    required: false
    default: "^master$,^main$"
  pre_release_branches:
    description: "Comma separated list of branches (JavaScript regular expression accepted) that will generate the pre-release tags."
    required: false
  scopes:
    description: "Comma separated list of scopes (bash reg exp accepted) to analyze and to include in the changelog."
    required: false
  branch_history:
    description: |
      Which commits feed the commit analyzer and the changelog.
      `compare` (default) - commits between the previous tag and the tagged commit (existing behaviour).
      `last` - only the tagged commit itself (useful for squash-merge workflows).
      `full` - every commit reachable from the tagged commit, narrowed to `default_branch..<commit>` when `default_branch` is set and differs from the current branch. Requires a full clone (`fetch-depth: 0`); falls back to `compare` with a warning on a shallow checkout.
      Unrecognized values fall back to `compare` with a warning.
    required: false
    default: "compare"
  default_branch:
    description: "The repository's default branch (e.g. `main`). Only used by `branch_history: full`, to narrow the range to the commits unique to the current branch. Not auto-detected."
    required: false
  commit_sha:
    description: "The commit SHA value to add the tag. If specified, it uses this value instead GITHUB_SHA. It could be useful when a previous step merged a branch into github.ref."
    required: false
  source:
    description: "Path to the local git checkout used for the local-git operations (the `git log` fallback of the compare API, the shallow-clone probe, and `tag_context: branch` ancestry checks). GitHub API calls are repository-global and unaffected (default: `.`)."
    required: false
    default: "."
  create_annotated_tag:
    description: "Boolean to create an annotated tag rather than lightweight."
    required: false
    default: "false"
  tag_message:
    description: "Message for the annotated tag object (default: the tag name). Only used when `create_annotated_tag` is `true`; setting it with `create_annotated_tag: false` logs a warning and is otherwise ignored."
    required: false
  fetch_all_tags:
    description: "Boolean to fetch all tags for a repo (if false, only the last 100 will be fetched)."
    required: false
    default: "false"
  dry_run:
    description: "Do not perform tagging, just calculate next version and changelog, then exit."
    required: false
    default: "false"
  push_tag:
    description: "Push the created tag to remote ref. If false, tag is created, but not pushed."
    required: false
    default: "true"
  commit_analyzer_preset:
    description: "The semantic-release commit-analyzer preset to use for parsing the commit list. Refer to this list of available options. https://github.com/semantic-release/commit-analyzer?tab=readme-ov-file#options"
    required: false
    default: "angular"
  soft_fail:
    description: "If true, an unrecoverable error (after retries/fallbacks) is reported as a warning and the step exits successfully without creating a tag, instead of failing the job."
    required: false
    default: "false"

runs:
  using: "node24"
  main: "lib/main.cjs"
branding:
  icon: "git-merge"
  color: "purple"
